<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DevPlayerSP</title>
  <meta name="description" content="Games, lives e gameplay. Todos os canais do DevPlayerSP: YouTube, Twitch, TikTok, Instagram e Threads.">
  <meta name="theme-color" content="#111116">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://devplayersp.github.io/">
  <meta property="og:title" content="DevPlayerSP">
  <meta property="og:description" content="Games, lives e gameplay. Todos os canais em um só lugar.">
  <meta property="og:image" content="https://devplayersp.github.io/assets/og.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Montserrat:ital,wght@0,700;1,800;1,900&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header class="hero">
      <h1 class="sr-only">DevPlayerSP</h1>
      <img class="banner" src="assets/banner.jpg" alt="DEV PLAYER SP" width="1600" height="533">
      <p class="tagline">Games <span>/</span> Lives <span>/</span> Gameplay</p>
    </header>

    <nav id="links" class="links" aria-label="Canais"></nav>

    <!-- Área de propagandas / parceiros. Fica escondida enquanto a lista ADS estiver vazia. -->
    <section id="ads" class="ads" hidden>
      <h2>Parceiros</h2>
      <div id="ads-list" class="ads-list"></div>
    </section>

    <footer>© <span id="year"></span> DevPlayerSP</footer>
  </main>

  <script>
    // ====== EDITE AQUI ======
    // icon = nome do ícone em https://simpleicons.org
    const LINKS = [
      { label: "YouTube",   url: "https://www.youtube.com/@devplayersp",  icon: "youtube" },
      { label: "Twitch",    url: "https://www.twitch.tv/devplayersp",     icon: "twitch" },
      { label: "TikTok",    url: "https://www.tiktok.com/@devplayersp",   icon: "tiktok" },
      { label: "Instagram", url: "https://www.instagram.com/devplayersp", icon: "instagram" },
      { label: "Threads",   url: "https://www.threads.net/@devplayersp",  icon: "threads" },
    ];

    // Propagandas: deixe vazio para esconder a seção.
    // Exemplo: { title: "Loja X", text: "10% off com o cupom DEV", url: "https://...", image: "assets/ads/lojax.png" }
    const ADS = [];
    // ========================

    const ICON_CDN = "https://cdn.jsdelivr.net/npm/simple-icons@11.0.0/icons/";

    const linksEl = document.getElementById("links");
    LINKS.forEach((l, i) => {
      const a = document.createElement("a");
      a.className = "link";
      a.style.setProperty("--i", i);
      a.href = l.url;
      a.target = "_blank";
      a.rel = "noopener";
      a.innerHTML = `<span class="icon" style="--icon:url('${ICON_CDN}${l.icon}.svg')"></span><span class="label">${l.label}</span><span class="arrow" aria-hidden="true">›</span>`;
      linksEl.appendChild(a);
    });

    if (ADS.length) {
      const list = document.getElementById("ads-list");
      for (const ad of ADS) {
        const a = document.createElement("a");
        a.className = "ad";
        a.href = ad.url;
        a.target = "_blank";
        a.rel = "noopener sponsored";
        a.innerHTML = `${ad.image ? `<img src="${ad.image}" alt="">` : ""}<div><strong>${ad.title}</strong><small>${ad.text || ""}</small></div>`;
        list.appendChild(a);
      }
      document.getElementById("ads").hidden = false;
    }

    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
